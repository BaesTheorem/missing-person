# SYNTHETIC EXAMPLE. Not a real person, not a real case.
#
# It exists so the toolkit runs and the tests pass without any real case data
# in this repository. Real case files name a living person and describe them,
# so they live outside this repo (see missing_person/case.py for the search
# order). Copy this file, fill it in, and put it in your cases directory.
#
# The shape here is doing deliberate work. Read the notes.

[case]
id = "example"
display_name = "Example Person"
legal_name = "Example Q. Person"
aka = ["Ex"]
last_seen_date = "2026-01-15"
# Earliest date a recovery could still be this person. Set it to the EARLIEST
# date ANY source claims, not the best-supported one. This bound EXCLUDES
# candidates, and an over-tight bound throws away real leads.
recovery_floor = "2026-01-10"
clothing = "dark jacket, jeans"
agency = "Example County Sheriff's Office"
namus_mp = 0            # NamUs case number, or omit if not entered yet
mshp_first = "Example"  # name as the state NCIC feed spells it
mshp_last = "Person"
# States whose unidentified-person records to sweep. Start local; widen with
# `mp unidentified <case> --national` when a local sweep comes back empty.
search_states = ["Missouri", "Kansas"]
news_terms = ["Example Person"]
# Place names that keep a common personal name attached to THIS case. Without
# them a news sweep returns every athlete and obituary sharing the name.
locality_terms = ["Example County", "Kansas City", "Missouri"]
# How local newsrooms name the investigating agency. Most headlines about a
# missing person never print the name ("County deputies searching for missing
# 30-year-old man"), and a Google News feed summary is only the headline
# again, so these
# terms plus the age and last-seen date are what identify such a story at all.
# Defaults to the full `agency` string, which newsrooms rarely write out.
agency_terms = ["Example County Sheriff", "Example County deputies"]

[description]
sex = "Male"
race = "White"
age_at_disappearance = 30
# RANGES, not points. Sources disagree about height and weight more often than
# not, and filtering on one number silently discards the candidate the other
# number would have caught.
height_in = [68, 70]
weight_lb = [150, 175]
hair = "Brown"
eyes = "Blue"

# Every date any source asserts, with the source named. Cases routinely carry
# three or four. Keeping them listed is how the discrepancy stays visible.
[date_claims]
"NCIC missing-since" = "2026-01-10"
"Last confirmed contact" = "2026-01-14 about 9:00 PM"
"Last camera observation" = "2026-01-15 about 1:15 AM"

[agency_phones]
missing_persons = "555-0100"
emergency = "911"

# One block per CLAIMED last-seen location, each with its provenance. Do not
# reconcile them by picking a favourite: `mp status` reports the distance
# between them, and a five-mile disagreement is a search-area question, not a
# config tidiness problem.
[[locations]]
label = "Home address"
source = "agency record"
lat = 39.0997
lon = -94.5786
# How precise this claim actually is, in miles. NOT decoration: public
# databases publish coarsened coordinates (NamUs's publicGeolocation is a
# centroid), and differencing one against a street intersection produces a
# number that looks like a finding and is an artifact.
# Street address ~0.05, named intersection ~0.25, neighbourhood ~1.0,
# ZIP or city centroid ~2.5.
precision_mi = 2.5
# Census ZCTA. Carried separately because when two coarse coordinates cannot
# be told apart, the ZIPs each source recorded still can be.
zcta = "64111"
note = "Camera caught them leaving on foot."

[[locations]]
label = "Reported sighting, north side"
source = "family flyer"
lat = 39.1500
lon = -94.6000
precision_mi = 0.25
zcta = "64118"
note = "Compute an intersection rather than eyeballing it; grade-separated roads share no map node."

[links]
"NamUs" = "https://www.namus.gov/MissingPersons"
"Example agency page" = "https://example.invalid/missing"
